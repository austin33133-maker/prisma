services:
  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: 'file:/app/data/dazi.db'
      PORT: '3000'
    volumes:
      - dazi-data:/app/data
    ports:
      - '3000:3000'

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  dazi-data:
  caddy-data:
  caddy-config:
