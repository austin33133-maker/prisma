<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Dash Runner — an endless runner</title>
    <style>
      :root {
        --ui: #fff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        height: 100%;
        background: #0b1020;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
        user-select: none;
      }
      #wrap {
        position: relative;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        background: #10193a;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        touch-action: none;
      }
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: var(--ui);
        gap: 18px;
        background: rgba(6, 10, 26, 0.72);
        backdrop-filter: blur(4px);
        padding: 24px;
      }
      .overlay.hidden { display: none; }
      .title {
        font-size: clamp(34px, 9vw, 60px);
        font-weight: 900;
        letter-spacing: 1px;
        background: linear-gradient(180deg, #ffe259, #ffa751);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 4px 20px rgba(255, 167, 81, 0.3);
      }
      .subtitle { font-size: 15px; opacity: 0.85; max-width: 320px; line-height: 1.5; }
      .btn {
        margin-top: 6px;
        border: none;
        cursor: pointer;
        font-weight: 800;
        font-size: 18px;
        color: #17203f;
        padding: 14px 40px;
        border-radius: 999px;
        background: linear-gradient(180deg, #ffe259, #ffa751);
        box-shadow: 0 8px 24px rgba(255, 167, 81, 0.4);
        transition: transform 0.08s ease;
      }
      .btn:active { transform: scale(0.96); }
      .keys { font-size: 13px; opacity: 0.7; line-height: 1.8; }
      .keys b { color: #ffd166; }
      .big-score { font-size: 44px; font-weight: 900; color: #ffd166; }
      .row { display: flex; gap: 28px; font-size: 15px; opacity: 0.9; }
      .row div span { display: block; font-size: 26px; font-weight: 800; color: #fff; }
      .new-best {
        font-size: 14px; font-weight: 800; color: #10193a;
        background: #63e6a0; padding: 4px 14px; border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="game"></canvas>

      <div id="startScreen" class="overlay">
        <div class="title">DASH RUNNER</div>
        <div class="subtitle">A Subway-Surfers-style endless runner. Dodge the trains, leap the barriers, slide under the beams, and grab every coin.</div>
        <button class="btn" id="startBtn">TAP TO PLAY</button>
        <div class="keys">
          <b>← →</b> or <b>A D</b> · switch lane<br />
          <b>↑</b> / <b>Space</b> · jump &nbsp;·&nbsp; <b>↓</b> · slide<br />
          on touch: <b>swipe</b> in any direction
        </div>
      </div>

      <div id="overScreen" class="overlay hidden">
        <div class="title" style="font-size: clamp(28px, 7vw, 46px)">GAME OVER</div>
        <div id="newBest" class="new-best" style="display: none">NEW BEST!</div>
        <div class="big-score" id="finalScore">0</div>
        <div class="row">
          <div>COINS<span id="finalCoins">0</span></div>
          <div>BEST<span id="bestScore">0</span></div>
        </div>
        <button class="btn" id="retryBtn">PLAY AGAIN</button>
      </div>
    </div>

    <script>
      (function () {
        'use strict';

        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        // ---- Layout / view ----------------------------------------------------
        const VIEW_W = 440;
        const VIEW_H = 780;
        let W = VIEW_W;
        let H = VIEW_H;

        function resize() {
          const maxH = window.innerHeight;
          const maxW = window.innerWidth;
          const ratio = VIEW_W / VIEW_H;
          let h = maxH;
          let w = h * ratio;
          if (w > maxW) {
            w = maxW;
            h = w / ratio;
          }
          canvas.style.width = w + 'px';
          canvas.style.height = h + 'px';
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = VIEW_W * dpr;
          canvas.height = VIEW_H * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          W = VIEW_W;
          H = VIEW_H;
        }
        window.addEventListener('resize', resize);
        resize();

        // ---- Pseudo-3D projection --------------------------------------------
        // World: x = lane offset in px @ z0, y = height in px @ z0, z = depth (0 near .. far).
        const HORIZON = H * 0.34;
        const GROUND_Y = H * 0.9;
        const ZFACTOR = 0.55; // perspective strength
        const LANE_PX = 96; // horizontal spacing between lanes @ z0
        const LANES = [-1, 0, 1];

        function projScale(z) {
          return 1 / (1 + z * ZFACTOR);
        }
        function project(worldX, worldY, z) {
          const s = projScale(z);
          return {
            x: W / 2 + worldX * s,
            y: HORIZON + (GROUND_Y - HORIZON) * s - worldY * s,
            s: s,
          };
        }

        // ---- Game state -------------------------------------------------------
        const State = { MENU: 0, PLAY: 1, OVER: 2 };
        let state = State.MENU;

        const PLAYER_H = 92; // upright height in px @ z0
        const player = {
          lane: 0,
          x: 0, // current interpolated world x
          targetX: 0,
          y: 0, // height above ground
          vy: 0,
          jumping: false,
          sliding: false,
          slideT: 0,
          legPhase: 0,
        };

        const GRAVITY = 2600;
        const JUMP_V = 900;
        const SLIDE_TIME = 0.55;
        const SPAWN_Z = 14; // far spawn distance
        const DESPAWN_Z = -1.2;

        let obstacles = [];
        let coins = [];
        let speed = 0;
        let baseSpeed = 6.5;
        let distance = 0;
        let score = 0;
        let coinCount = 0;
        let nextSpawn = 0;
        let sleeperOffset = 0;
        let shake = 0;
        let best = Number(localStorage.getItem('dashrunner_best') || 0);

        function reset() {
          obstacles = [];
          coins = [];
          player.lane = 0;
          player.x = 0;
          player.targetX = 0;
          player.y = 0;
          player.vy = 0;
          player.jumping = false;
          player.sliding = false;
          player.slideT = 0;
          speed = baseSpeed;
          distance = 0;
          score = 0;
          coinCount = 0;
          nextSpawn = 6;
          shake = 0;
        }

        // ---- Spawning ---------------------------------------------------------
        const OB_LOW = 'low'; // jump over
        const OB_HIGH = 'high'; // slide under
        const OB_TRAIN = 'train'; // must change lane

        function spawnRow() {
          // Decide how many lanes to block, always leave >= 1 free.
          const blockCount = Math.random() < 0.35 ? 2 : 1;
          const laneIdx = [0, 1, 2];
          shuffle(laneIdx);
          const blocked = laneIdx.slice(0, blockCount);
          const freeLanes = laneIdx.slice(blockCount);

          blocked.forEach((li) => {
            const r = Math.random();
            let type;
            if (r < 0.4) type = OB_TRAIN;
            else if (r < 0.7) type = OB_LOW;
            else type = OB_HIGH;
            obstacles.push({
              lane: LANES[li],
              z: SPAWN_Z + Math.random() * 1.5,
              type,
              resolved: false,
              len: type === OB_TRAIN ? 2.4 : 0.6,
            });
          });

          // Sprinkle a coin arc in a free lane.
          if (Math.random() < 0.85) {
            const cl = LANES[freeLanes[Math.floor(Math.random() * freeLanes.length)]];
            const n = 4 + Math.floor(Math.random() * 4);
            const arc = Math.random() < 0.35; // arc jumps into the air
            for (let i = 0; i < n; i++) {
              coins.push({
                lane: cl,
                z: SPAWN_Z + i * 0.55,
                y: arc ? Math.sin((i / (n - 1)) * Math.PI) * 90 : 26,
                got: false,
              });
            }
          }
        }

        function shuffle(a) {
          for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
          }
        }

        // ---- Input ------------------------------------------------------------
        function moveLane(dir) {
          if (state !== State.PLAY) return;
          const idx = LANES.indexOf(player.lane) + dir;
          if (idx < 0 || idx >= LANES.length) return;
          player.lane = LANES[idx];
          player.targetX = player.lane * LANE_PX;
        }
        function jump() {
          if (state !== State.PLAY) return;
          if (!player.jumping) {
            player.jumping = true;
            player.vy = JUMP_V;
            player.sliding = false;
            player.slideT = 0;
          }
        }
        function slide() {
          if (state !== State.PLAY) return;
          if (!player.sliding) {
            player.sliding = true;
            player.slideT = SLIDE_TIME;
            if (player.jumping) {
              // fast-drop out of a jump into a slide
              player.vy = -600;
            }
          }
        }

        window.addEventListener('keydown', (e) => {
          switch (e.key) {
            case 'ArrowLeft': case 'a': case 'A': moveLane(-1); e.preventDefault(); break;
            case 'ArrowRight': case 'd': case 'D': moveLane(1); e.preventDefault(); break;
            case 'ArrowUp': case 'w': case 'W': case ' ': jump(); e.preventDefault(); break;
            case 'ArrowDown': case 's': case 'S': slide(); e.preventDefault(); break;
            case 'Enter':
              if (state !== State.PLAY) startGame();
              break;
          }
        });

        // Touch / swipe
        let touchStart = null;
        canvas.addEventListener('touchstart', (e) => {
          touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
        }, { passive: true });
        canvas.addEventListener('touchend', (e) => {
          if (!touchStart) return;
          const t = e.changedTouches[0];
          const dx = t.clientX - touchStart.x;
          const dy = t.clientY - touchStart.y;
          const adx = Math.abs(dx);
          const ady = Math.abs(dy);
          if (adx < 24 && ady < 24) {
            jump(); // tap
          } else if (adx > ady) {
            moveLane(dx > 0 ? 1 : -1);
          } else {
            if (dy > 0) slide(); else jump();
          }
          touchStart = null;
        }, { passive: true });

        document.getElementById('startBtn').onclick = startGame;
        document.getElementById('retryBtn').onclick = startGame;

        function startGame() {
          reset();
          state = State.PLAY;
          document.getElementById('startScreen').classList.add('hidden');
          document.getElementById('overScreen').classList.add('hidden');
        }

        function gameOver() {
          state = State.OVER;
          shake = 18;
          const isBest = Math.floor(score) > best;
          if (isBest) {
            best = Math.floor(score);
            localStorage.setItem('dashrunner_best', String(best));
          }
          document.getElementById('finalScore').textContent = Math.floor(score);
          document.getElementById('finalCoins').textContent = coinCount;
          document.getElementById('bestScore').textContent = best;
          document.getElementById('newBest').style.display = isBest ? 'block' : 'none';
          document.getElementById('overScreen').classList.remove('hidden');
        }

        // ---- Update -----------------------------------------------------------
        function update(dt) {
          if (state !== State.PLAY) return;

          speed = baseSpeed + distance * 0.0018;
          distance += speed * dt;
          score += speed * dt * 3.2;
          sleeperOffset = (sleeperOffset + speed * dt) % 1;
          player.legPhase += speed * dt * 2.2;

          // Smoothly slide the player toward the target lane.
          player.x += (player.targetX - player.x) * Math.min(1, dt * 16);

          // Vertical motion.
          if (player.jumping) {
            player.vy -= GRAVITY * dt;
            player.y += player.vy * dt;
            if (player.y <= 0) {
              player.y = 0;
              player.vy = 0;
              player.jumping = false;
            }
          }
          if (player.sliding) {
            player.slideT -= dt;
            if (player.slideT <= 0) player.sliding = false;
          }

          // Move world toward the camera.
          const dz = speed * dt;
          for (const o of obstacles) o.z -= dz;
          for (const c of coins) c.z -= dz;

          // Spawn.
          nextSpawn -= dz;
          if (nextSpawn <= 0) {
            spawnRow();
            const gap = Math.max(2.6, 4.6 - distance * 0.0009);
            nextSpawn = gap;
          }

          // Collisions with obstacles at the player plane.
          for (const o of obstacles) {
            if (o.resolved) continue;
            if (o.z - o.len / 2 <= 0) {
              o.resolved = true;
              if (o.lane === player.lane) {
                let safe = false;
                if (o.type === OB_LOW) safe = player.y > 46; // jumped over
                else if (o.type === OB_HIGH) safe = player.sliding; // slid under
                else safe = false; // train: cannot pass in-lane
                if (!safe) return gameOver();
              }
            }
          }

          // Coin pickup near the player plane.
          for (const c of coins) {
            if (c.got) continue;
            if (Math.abs(c.z) < 0.45 && c.lane === player.lane) {
              const dy = Math.abs((player.y + (player.sliding ? 20 : 46)) - c.y);
              if (dy < 70) {
                c.got = true;
                coinCount++;
                score += 12;
              }
            }
          }

          obstacles = obstacles.filter((o) => o.z > DESPAWN_Z);
          coins = coins.filter((c) => c.z > DESPAWN_Z && !c.got);

          if (shake > 0) shake = Math.max(0, shake - dt * 40);
        }

        // ---- Rendering --------------------------------------------------------
        function drawBackground() {
          const sky = ctx.createLinearGradient(0, 0, 0, HORIZON);
          sky.addColorStop(0, '#2a3a7a');
          sky.addColorStop(1, '#8a6fb0');
          ctx.fillStyle = sky;
          ctx.fillRect(0, 0, W, HORIZON);

          // sun
          ctx.fillStyle = 'rgba(255, 220, 150, 0.9)';
          ctx.beginPath();
          ctx.arc(W * 0.7, HORIZON * 0.55, 40, 0, Math.PI * 2);
          ctx.fill();

          // distant skyline
          ctx.fillStyle = '#3a2f5e';
          const bw = 34;
          for (let i = 0; i < W / bw + 1; i++) {
            const h = 24 + ((i * 53) % 60);
            ctx.fillRect(i * bw, HORIZON - h, bw - 6, h);
          }
        }

        function drawTrack() {
          // Ground trapezoid
          const nearL = project(-1.7 * LANE_PX, 0, 0);
          const nearR = project(1.7 * LANE_PX, 0, 0);
          const farL = project(-1.7 * LANE_PX, 0, SPAWN_Z);
          const farR = project(1.7 * LANE_PX, 0, SPAWN_Z);
          ctx.fillStyle = '#3c4a6b';
          ctx.beginPath();
          ctx.moveTo(nearL.x, nearL.y);
          ctx.lineTo(nearR.x, nearR.y);
          ctx.lineTo(farR.x, farR.y);
          ctx.lineTo(farL.x, farL.y);
          ctx.closePath();
          ctx.fill();

          // Rails (lane boundaries at -0.5 and 0.5 between lanes, plus outer)
          ctx.strokeStyle = 'rgba(255,255,255,0.28)';
          ctx.lineWidth = 2;
          [-1.5, -0.5, 0.5, 1.5].forEach((lx) => {
            const a = project(lx * LANE_PX, 0, 0.1);
            const b = project(lx * LANE_PX, 0, SPAWN_Z);
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          });

          // Sleepers (ties) moving toward camera for a sense of speed
          for (let i = 0; i < 22; i++) {
            const z = i * 0.62 + sleeperOffset * 0.62 + 0.1;
            const l = project(-1.6 * LANE_PX, 0, z);
            const r = project(1.6 * LANE_PX, 0, z);
            const alpha = Math.max(0, 0.5 - z * 0.03);
            ctx.strokeStyle = 'rgba(20,25,45,' + alpha + ')';
            ctx.lineWidth = Math.max(1, 8 * projScale(z));
            ctx.beginPath();
            ctx.moveTo(l.x, l.y);
            ctx.lineTo(r.x, r.y);
            ctx.stroke();
          }
        }

        function shade(hex, f) {
          const n = parseInt(hex.slice(1), 16);
          let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
          r = Math.round(Math.min(255, r * f));
          g = Math.round(Math.min(255, g * f));
          b = Math.round(Math.min(255, b * f));
          return 'rgb(' + r + ',' + g + ',' + b + ')';
        }

        function drawBox(cx, halfW, base, top, zNear, zFar, color) {
          // 8 corners of a box in world space, projected.
          const p = (x, y, z) => project(x, y, z);
          const bl = p(cx - halfW, base, zNear), br = p(cx + halfW, base, zNear);
          const tl = p(cx - halfW, top, zNear), tr = p(cx + halfW, top, zNear);
          const Bl = p(cx - halfW, base, zFar), Br = p(cx + halfW, base, zFar);
          const Tl = p(cx - halfW, top, zFar), Tr = p(cx + halfW, top, zFar);

          // top face
          ctx.fillStyle = shade(color, 1.25);
          quad(tl, tr, Tr, Tl);
          // right side
          ctx.fillStyle = shade(color, 0.7);
          quad(tr, br, Br, Tr);
          // left side
          ctx.fillStyle = shade(color, 0.85);
          quad(tl, bl, Bl, Tl);
          // front face
          ctx.fillStyle = color;
          quad(tl, tr, br, bl);
        }
        function quad(a, b, c, d) {
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.lineTo(c.x, c.y);
          ctx.lineTo(d.x, d.y);
          ctx.closePath();
          ctx.fill();
        }

        function drawObstacle(o) {
          const cx = o.lane * LANE_PX;
          const zN = Math.max(0.02, o.z - o.len / 2);
          const zF = o.z + o.len / 2;
          if (o.type === OB_TRAIN) {
            drawBox(cx, LANE_PX * 0.42, 6, 150, zN, zF, '#e0524b');
            // windows
          } else if (o.type === OB_LOW) {
            drawBox(cx, LANE_PX * 0.42, 6, 44, zN, zF, '#ffb020');
          } else {
            // high beam to slide under: floating bar
            drawBox(cx, LANE_PX * 0.44, 96, 150, zN, zF, '#57b0e6');
          }
        }

        function drawCoin(c) {
          const pt = project(c.lane * LANE_PX, c.y, c.z);
          const r = 12 * pt.s;
          if (r < 0.5) return;
          ctx.save();
          ctx.translate(pt.x, pt.y);
          const wob = Math.abs(Math.sin(distance * 3 + c.z));
          ctx.scale(0.35 + wob * 0.65, 1);
          ctx.fillStyle = '#ffd54a';
          ctx.strokeStyle = '#e0a520';
          ctx.lineWidth = 2 * pt.s;
          ctx.beginPath();
          ctx.arc(0, 0, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }

        function drawPlayer() {
          const cx = player.x;
          const upright = !player.sliding;
          const bodyTop = player.y + (upright ? PLAYER_H : 40);
          const bodyBase = player.y + (upright ? 0 : 0);
          const halfW = upright ? 22 : 30;

          // shadow
          const sh = project(cx, 0, 0.02);
          ctx.fillStyle = 'rgba(0,0,0,0.28)';
          ctx.beginPath();
          ctx.ellipse(sh.x, sh.y + 4, 30 - player.y * 0.06, 9, 0, 0, Math.PI * 2);
          ctx.fill();

          // legs (only when upright & grounded)
          if (upright && !player.jumping) {
            const swing = Math.sin(player.legPhase) * 14;
            legBox(cx - 9, bodyBase, swing, '#2b4a8a');
            legBox(cx + 9, bodyBase, -swing, '#24407a');
          }

          // torso
          drawBox(cx, halfW, bodyBase + (upright ? 24 : 6), bodyTop, 0.0, 0.34, '#2f6fd0');
          // head
          const headBase = bodyTop;
          drawBox(cx, 15, headBase, headBase + 30, 0.02, 0.3, '#ffcf9e');
          // cap
          drawBox(cx, 17, headBase + 24, headBase + 34, 0.02, 0.3, '#e0524b');
        }
        function legBox(lx, base, off, color) {
          const zN = 0.0, zF = 0.2;
          const p = (x, y, z) => project(x, y, z);
          const top = base + 30;
          const bl = p(lx - 7, base, zN + Math.max(0, off) * 0.001), br = p(lx + 7, base, zN);
          const tl = p(lx - 7, top, zF), tr = p(lx + 7, top, zF);
          ctx.fillStyle = color;
          // simple front-facing leg with slight vertical offset for stride
          const yo = off;
          ctx.beginPath();
          ctx.moveTo(tl.x, tl.y);
          ctx.lineTo(tr.x, tr.y);
          ctx.lineTo(br.x, br.y + Math.max(0, yo));
          ctx.lineTo(bl.x, bl.y + Math.max(0, yo));
          ctx.closePath();
          ctx.fill();
        }

        function drawHUD() {
          ctx.fillStyle = '#fff';
          ctx.font = '900 30px system-ui, sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText(String(Math.floor(score)), 18, 44);
          ctx.font = '700 14px system-ui, sans-serif';
          ctx.fillStyle = 'rgba(255,255,255,0.7)';
          ctx.fillText('SCORE', 18, 62);

          // coin counter
          ctx.textAlign = 'right';
          ctx.fillStyle = '#ffd54a';
          ctx.beginPath();
          ctx.arc(W - 92, 38, 11, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.font = '900 24px system-ui, sans-serif';
          ctx.fillText(String(coinCount), W - 18, 47);

          // speed pill
          ctx.textAlign = 'center';
          ctx.font = '700 12px system-ui, sans-serif';
          ctx.fillStyle = 'rgba(255,255,255,0.6)';
          ctx.fillText('SPEED ' + speed.toFixed(1), W / 2, 24);
        }

        function render() {
          ctx.save();
          if (shake > 0) {
            ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
          }
          ctx.clearRect(-30, -30, W + 60, H + 60);
          drawBackground();
          drawTrack();

          // Draw far-to-near for correct overlap.
          const items = [];
          for (const o of obstacles) items.push({ z: o.z, kind: 'o', ref: o });
          for (const c of coins) items.push({ z: c.z, kind: 'c', ref: c });
          items.sort((a, b) => b.z - a.z);
          for (const it of items) {
            if (it.kind === 'o') drawObstacle(it.ref);
            else drawCoin(it.ref);
          }

          if (state !== State.MENU) drawPlayer();
          if (state === State.PLAY || state === State.OVER) drawHUD();
          ctx.restore();
        }

        // ---- Main loop --------------------------------------------------------
        let last = performance.now();
        function frame(now) {
          let dt = (now - last) / 1000;
          last = now;
          if (dt > 0.05) dt = 0.05; // clamp after tab switches
          update(dt);
          render();
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);

        // Expose a tiny hook for automated testing.
        window.__dash = {
          get state() { return state; },
          get score() { return Math.floor(score); },
          get coins() { return coinCount; },
          start: startGame,
          input: { left: () => moveLane(-1), right: () => moveLane(1), jump, slide },
        };
      })();
    </script>
  </body>
</html>
